name: Build CloudStream Plugins (Beta)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all plugins (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Convert .aar to .cs files
        run: |
          mkdir -p builds
          find . -path "*/build/outputs/aar/*-debug.aar" -type f | while read aar; do
            module_name=$(echo "$aar" | sed 's|^\./||' | sed 's|/build/outputs/aar/.*||')
            cp "$aar" "builds/${module_name}.cs"
            echo "✓ $module_name → builds/${module_name}.cs"
          done

      - name: Generate plugins.json
        run: |
          API_VERSION=4
          cat > builds/plugins.json << EOF
          [
            {
              "internalName": "HDFilmCehennemi",
              "url": "https://raw.githubusercontent.com/tamersariii/xcloudstream_tr_repo/builds/HDFilmCehennemi.cs",
              "version": 1,
              "description": "HDFilmCehennemi.nl üzerinden film ve dizi izleme",
              "authors": ["tamersariii"],
              "tvTypes": ["Movie", "TvSeries"],
              "language": "tr",
              "iconUrl": "https://www.hdfilmcehennemi.nl/favicon.ico",
              "apiVersion": ${API_VERSION},
              "status": 1,
              "repositoryUrl": "https://github.com/tamersariii/xcloudstream_tr_repo"
            },
            {
              "internalName": "FullHDFilmizlesene",
              "url": "https://raw.githubusercontent.com/tamersariii/xcloudstream_tr_repo/builds/FullHDFilmizlesene.cs",
              "version": 1,
              "description": "FullHDFilmizlesene.now üzerinden film izleme",
              "authors": ["tamersariii"],
              "tvTypes": ["Movie"],
              "language": "tr",
              "iconUrl": "https://www.fullhdfilmizlesene.now/favicon.ico",
              "apiVersion": ${API_VERSION},
              "status": 1,
              "repositoryUrl": "https://github.com/tamersariii/xcloudstream_tr_repo"
            },
            {
              "internalName": "FilmMakinesi",
              "url": "https://raw.githubusercontent.com/tamersariii/xcloudstream_tr_repo/builds/FilmMakinesi.cs",
              "version": 1,
              "description": "FilmMakinesi.to üzerinden film ve dizi izleme",
              "authors": ["tamersariii"],
              "tvTypes": ["Movie", "TvSeries"],
              "language": "tr",
              "iconUrl": "https://filmmakinesi.to/favicon.ico",
              "apiVersion": ${API_VERSION},
              "status": 1,
              "repositoryUrl": "https://github.com/tamersariii/xcloudstream_tr_repo"
            },
            {
              "internalName": "UltraFilmizle",
              "url": "https://raw.githubusercontent.com/tamersariii/xcloudstream_tr_repo/builds/UltraFilmizle.cs",
              "version": 1,
              "description": "UltraFilmizle.org üzerinden film izleme",
              "authors": ["tamersariii"],
              "tvTypes": ["Movie"],
              "language": "tr",
              "iconUrl": "https://ultrafilmizle.org/favicon.ico",
              "apiVersion": ${API_VERSION},
              "status": 1,
              "repositoryUrl": "https://github.com/tamersariii/xcloudstream_tr_repo"
            },
            {
              "internalName": "HDFilmizle",
              "url": "https://raw.githubusercontent.com/tamersariii/xcloudstream_tr_repo/builds/HDFilmizle.cs",
              "version": 1,
              "description": "HDFilmizle.vip üzerinden film ve dizi izleme",
              "authors": ["tamersariii"],
              "tvTypes": ["Movie", "TvSeries"],
              "language": "tr",
              "iconUrl": "https://www.hdfilmizle.vip/favicon.ico",
              "apiVersion": ${API_VERSION},
              "status": 1,
              "repositoryUrl": "https://github.com/tamersariii/xcloudstream_tr_repo"
            },
            {
              "internalName": "FilmKutusu",
              "url": "https://raw.githubusercontent.com/tamersariii/xcloudstream_tr_repo/builds/FilmKutusu.cs",
              "version": 1,
              "description": "FilmKutusu.com üzerinden film izleme",
              "authors": ["tamersariii"],
              "tvTypes": ["Movie"],
              "language": "tr",
              "iconUrl": "https://filmkutusu.com/favicon.ico",
              "apiVersion": ${API_VERSION},
              "status": 1,
              "repositoryUrl": "https://github.com/tamersariii/xcloudstream_tr_repo"
            },
            {
              "internalName": "HDFilmizlesende",
              "url": "https://raw.githubusercontent.com/tamersariii/xcloudstream_tr_repo/builds/HDFilmizlesende.cs",
              "version": 1,
              "description": "HDFilmizlesende.com üzerinden film ve dizi izleme",
              "authors": ["tamersariii"],
              "tvTypes": ["Movie", "TvSeries"],
              "language": "tr",
              "iconUrl": "https://hdfilmizlesende.com/favicon.ico",
              "apiVersion": ${API_VERSION},
              "status": 1,
              "repositoryUrl": "https://github.com/tamersariii/xcloudstream_tr_repo"
            }
          ]
          EOF
          echo "=== builds/plugins.json oluşturuldu (API v${API_VERSION}) ==="
          cat builds/plugins.json

      - name: Verify builds directory
        if: always()
        run: |
          echo "=== builds/ içeriği ==="
          ls -la builds/
          echo ""
          echo "=== plugins.json ilk 5 satır ==="
          head -5 builds/plugins.json

      - name: Deploy to builds branch
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./builds
          publish_branch: builds
          force_orphan: true
          enable_jekyll: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Build: ${{ github.event.head_commit.message }}'
