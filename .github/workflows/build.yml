name: Build Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all plugins
        run: ./gradlew make makePluginsJson

      - name: Verify builds directory
        run: |
          echo "=== builds/ klasörü içeriği ==="
          if [ -d "builds" ]; then
            ls -la builds/
          else
            echo "HATA: builds klasörü oluşturulmamış!"
            find . -name "*.cs" -type f
            find . -name "plugins.json" -type f
            exit 1
          fi

      - name: Deploy to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./builds
          publish_branch: builds
          force_orphan: true
          enable_jekyll: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Build: ${{ github.event.head_commit.message }}'
