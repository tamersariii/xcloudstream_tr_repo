name: Diagnose Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  diagnose:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: TEST A - Compile only HDFilmCehennemi
        continue-on-error: true
        run: ./gradlew :HDFilmCehennemi:assembleDebug --stacktrace --console=plain 2>&1 | tail -80

      - name: TEST B - Run make on HDFilmCehennemi
        continue-on-error: true
        run: ./gradlew :HDFilmCehennemi:make --info --console=plain 2>&1 | tail -120

      - name: TEST C - Show all files
        if: always()
        run: |
          echo "=== HDFilmCehennemi/build/ ==="
          find HDFilmCehennemi/build -type f 2>/dev/null | head -40 || echo "YOK"
          echo ""
          echo "=== Tüm .cs ==="
          find . -name "*.cs" 2>/dev/null || echo "YOK"
          echo ""
          echo "=== Tüm .jar (build altında) ==="
          find . -path "*/build/*" -name "*.jar" 2>/dev/null || echo "YOK"
          echo ""
          echo "=== Kotlin kaynak dosyaları ==="
          find . -name "*.kt" -not -path "*/build/*" 2>/dev/null
          echo ""
          echo "=== AndroidManifest.xml dosyaları ==="
          find . -name "AndroidManifest.xml" -not -path "*/build/*" 2>/dev/null
          echo ""
          echo "=== strings.xml dosyaları ==="
          find . -name "strings.xml" -not -path "*/build/*" 2>/dev/null
