name: Build Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all plugins (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Convert .aar to .cs files
        run: |
          mkdir -p builds
          echo "=== .aar dosyalarını .cs olarak kopyalıyorum ==="
          find . -path "*/build/outputs/aar/*-debug.aar" -type f | while read aar; do
            module_name=$(echo "$aar" | sed 's|^\./||' | sed 's|/build/outputs/aar/.*||')
            cp "$aar" "builds/${module_name}.cs"
            echo "✓ $module_name → builds/${module_name}.cs"
          done
          echo ""
          echo "=== builds/ içeriği ==="
          ls -la builds/

      - name: Generate plugins.json
        run: ./gradlew makePluginsJson --stacktrace || true

      - name: Verify builds directory
        if: always()
        run: |
          echo "=== builds/ ==="
          ls -la builds/
          echo ""
          echo "=== build/plugins.json ==="
          cat build/plugins.json 2>/dev/null || echo "build/plugins.json YOK"

      - name: Deploy to builds branch
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./builds
          publish_branch: builds
          force_orphan: true
          enable_jekyll: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Build: ${{ github.event.head_commit.message }}'
