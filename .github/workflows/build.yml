name: Build Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean previous builds
        run: ./gradlew clean

      - name: Build all plugins
        run: ./gradlew make makePluginsJson --stacktrace

      - name: Verify builds directory
        if: always()
        run: |
          echo "=========================================="
          echo "=== KÖK DİZİN ==="
          ls -la
          echo ""
          echo "=========================================="
          echo "=== builds/ KLASÖRÜ ==="
          ls -la builds/ 2>/dev/null || echo "builds/ YOK"
          echo ""
          echo "=========================================="
          echo "=== TÜM .cs DOSYALARI ==="
          find . -name "*.cs" -type f 2>/dev/null || echo ".cs YOK"
          echo ""
          echo "=========================================="
          echo "=== TÜM plugins.json ==="
          find . -name "plugins.json" -type f 2>/dev/null
          echo ""
          echo "=== build/plugins.json içeriği ==="
          cat build/plugins.json 2>/dev/null || echo "yok"
          echo ""
          echo "=========================================="
          echo "=== GRADLE MODÜLLERİ ==="
          ./gradlew projects --console=plain 2>&1 | head -40

      - name: Check builds exists
        run: |
          if [ ! -d "builds" ]; then
            echo "❌ builds/ oluşmadı!"
            exit 1
          fi
          echo "✅ builds/ mevcut"

      - name: Deploy to builds branch
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./builds
          publish_branch: builds
          force_orphan: true
          enable_jekyll: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Build: ${{ github.event.head_commit.message }}'
